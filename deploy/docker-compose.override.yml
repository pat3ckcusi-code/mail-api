# Drop this next to mailcow's docker-compose.yml (same directory, so Compose
# auto-merges it - this is mailcow's own documented pattern for adding
# custom services without touching the file that mailcow's update.sh
# regenerates). Adjust `build.context` if the mail-api source isn't at
# ../mail-api relative to that directory.
#
# mail-api talks to Dovecot/Postfix over the internal mailcow-network using
# their container aliases (dovecot/postfix) rather than round-tripping
# through the public domain - IMAP_TLS_SERVERNAME/SMTP_TLS_SERVERNAME make
# the TLS handshake still validate against the cert's real name
# (${MAILCOW_HOSTNAME}, pulled from mailcow's own .env) even though the
# connection itself goes to the internal hostname.
#
# Port 3100 is published to 127.0.0.1 because the actual public-facing proxy
# on this host is a standalone Traefik container running with
# network_mode: host (not part of this compose project) - it reaches
# backends via 127.0.0.1:<port>, the same way it already reaches this
# server's other local services. See deploy/DEPLOY.md.
services:
  mail-api:
    build:
      context: ../mail-api
    container_name: mail-api
    restart: always
    env_file:
      - ./mail-api.env # JWT_SECRET / CRED_ENC_KEY - see mail-api/.env.example. Not committed.
    environment:
      - PORT=3000
      - IMAP_HOST=dovecot
      - IMAP_PORT=993
      - IMAP_SECURE=true
      - IMAP_TLS_SERVERNAME=${MAILCOW_HOSTNAME}
      - SMTP_HOST=postfix
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_TLS_SERVERNAME=${MAILCOW_HOSTNAME}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - dovecot-mailcow
      - postfix-mailcow
    networks:
      mailcow-network:
        aliases:
          - mail-api
